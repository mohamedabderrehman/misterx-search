name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: synthetic-ci-only
      DB_NAME: demo
      DB_PORT: '3306'
      DEMO_PASSWORD: Synthetic-Demo-2026
      JWT_SECRET: synthetic-ci-signing-value-for-disposable-tests
      DEMO_MODE: '1'
      OPENSEARCH_INDEX: portfolio_records
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-only
          MARIADB_DATABASE: demo
        ports: ['3306:3306']
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-retries 20
      opensearch:
        image: opensearchproject/opensearch:2.19.3
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, pdo_sqlite, sqlite3, curl, fileinfo, mbstring, redis
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - run: composer install --no-interaction --prefer-dist && composer validate --no-check-publish
      - run: php tools/bootstrap.php
      - run: |
          for n in $(seq 1 90); do curl -fs http://localhost:9200 > /dev/null && break; sleep 2; done
          php tools/ingest-demo.php
          php tools/check-opensearch.php
